<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabi Rometal — Melodii</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#171922; --panel2:#1f2230;
    --txt:#e8eaf0; --muted:#878c9e;
    --accent:#ff7a3d; --green:#2ec47a; --red:#ff5068; --star:#ffd23f;
    --line:#282b38;
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:linear-gradient(160deg,#0e0f13,#15121a); color:var(--txt); min-height:100vh;}
  header{padding:22px 20px 16px; text-align:center; border-bottom:1px solid var(--line)}
  header h1{margin:0; font-size:22px; letter-spacing:.5px}
  header p{margin:6px 0 0; color:var(--muted); font-size:13px}
  .wrap{max-width:720px; margin:0 auto; padding:18px 16px 150px}

  .track{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:12px; transition:.15s}
  .track.playing{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
  .track-top{display:flex; align-items:center; gap:12px}
  .play-ico{width:40px; height:40px; border-radius:10px; flex:0 0 auto; background:var(--panel2); border:0; color:var(--txt); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .track.playing .play-ico{background:var(--accent); color:#1a0e06}
  .t-name{flex:1; min-width:0}
  .t-name .nm{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .t-name .sub{color:var(--muted); font-size:12px; margin-top:2px}

  .rate{display:flex; gap:8px; align-items:center}
  .rbtn{background:var(--panel2); border:1px solid var(--line); color:var(--muted); width:38px; height:34px; border-radius:9px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center}
  .rbtn.on-up{background:rgba(46,196,122,.18); border-color:var(--green); color:var(--green)}
  .rbtn.on-down{background:rgba(255,80,104,.18); border-color:var(--red); color:var(--red)}
  .rbtn.on-star{background:rgba(255,210,63,.18); border-color:var(--star); color:var(--star)}

  .note{width:100%; margin-top:10px; background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:9px 11px; font-size:13px; resize:vertical; height:38px; font-family:inherit}
  .note::placeholder{color:#5f6577}
  .msg{text-align:center; color:var(--muted); padding:40px 10px; font-size:14px; line-height:1.7}

  .player{position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:10px 14px 14px}
  .player .inner{max-width:720px; margin:0 auto}
  .now{font-size:13px; color:var(--muted); text-align:center; margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .now b{color:var(--txt); font-weight:600}
  .bar{display:flex; align-items:center; gap:10px}
  .seek{flex:1; -webkit-appearance:none; height:6px; border-radius:6px; background:var(--panel2); outline:none}
  .seek::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent); cursor:pointer}
  .seek::-moz-range-thumb{width:16px; height:16px; border:0; border-radius:50%; background:var(--accent); cursor:pointer}
  .time{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:40px; text-align:center}
  .ctrls{display:flex; align-items:center; justify-content:center; gap:16px; margin-top:8px}
  .cbtn{background:none; border:0; color:var(--txt); font-size:22px; cursor:pointer; padding:4px 8px}
  .cbtn.big{background:var(--accent); color:#1a0e06; width:52px; height:52px; border-radius:50%; font-size:22px; display:flex; align-items:center; justify-content:center}
</style>
</head>
<body>
<header>
  <h1>🔧 Gabi Rometal — Melodii</h1>
  <p>Confecții metalice la comandă · Valea Jiului · 0731 58 42 42</p>
</header>

<div class="wrap">
  <div id="list"></div>
  <div class="msg" id="msg">Se încarcă melodiile...</div>
</div>

<div class="player">
  <div class="inner">
    <div class="now" id="now">Alege o melodie</div>
    <div class="bar">
      <span class="time" id="cur">0:00</span>
      <input type="range" class="seek" id="seek" value="0" min="0" max="100" step="0.1">
      <span class="time" id="dur">0:00</span>
    </div>
    <div class="ctrls">
      <button class="cbtn" id="prev">⏮</button>
      <button class="cbtn big" id="playpause">▶</button>
      <button class="cbtn" id="next">⏭</button>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
/* ============================================================
   CONFIG — schimbă doar dacă repo-ul are alt nume.
   Pune melodiile (.mp3) în folderul "melodii/" din repo.
   Orice mp3 nou pe care-l urci acolo apare automat aici.
   ============================================================ */
const GH_OWNER  = "tirroxanimo-dotcom";
const GH_REPO   = "gabi-rometal";
const GH_BRANCH = "main";
const GH_FOLDER = "melodii";
/* ============================================================ */

(function(){
  const audio = document.getElementById('audio');
  const listEl = document.getElementById('list');
  const msgEl = document.getElementById('msg');
  let tracks = [];   // {name, url}
  let current = -1;

  const STORE_KEY = 'gabi_rometal_ratings_v1';
  let store = (()=>{ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); }catch(e){ return {}; } })();
  function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
  function getMeta(n){ return store[n] || {rating:0, note:''}; }
  function setMeta(n,m){ store[n]=m; saveStore(); }

  function fmt(t){ if(!isFinite(t)) return '0:00'; const m=Math.floor(t/60),s=Math.floor(t%60); return m+':'+(s<10?'0':'')+s; }
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // --- încarcă lista de melodii din GitHub (automat) ---
  function loadTracks(){
    const api = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FOLDER}?ref=${GH_BRANCH}`;
    fetch(api)
      .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(data=>{
        if(!Array.isArray(data)) throw new Error('folder gol');
        tracks = data
          .filter(f=> f.type==='file' && /\.(mp3|m4a|wav|ogg)$/i.test(f.name))
          .sort((a,b)=> a.name.localeCompare(b.name,'ro'))
          .map(f=> ({ name: f.name.replace(/\.[^.]+$/,''), url: f.download_url }));
        if(!tracks.length){ msgEl.textContent='Folderul "melodii" e gol. Urcă fișiere .mp3 acolo.'; return; }
        msgEl.style.display='none';
        render();
      })
      .catch(err=>{
        msgEl.innerHTML = 'Nu găsesc melodiile.<br><span style="font-size:12px">Verifică: repo-ul e public, există folderul <b>melodii/</b> cu fișiere .mp3, iar numele din config (sus în fișier) sunt corecte.</span>';
      });
  }

  function render(){
    listEl.innerHTML = '';
    tracks.forEach((t,i)=>{
      const meta = getMeta(t.name);
      const div = document.createElement('div');
      div.className = 'track' + (i===current?' playing':'');
      div.innerHTML = `
        <div class="track-top">
          <button class="play-ico" data-play="${i}">${i===current && !audio.paused ? '❚❚' : '▶'}</button>
          <div class="t-name">
            <div class="nm">${escapeHtml(t.name)}</div>
            <div class="sub">melodia ${i+1}</div>
          </div>
          <div class="rate">
            <button class="rbtn ${meta.rating===1?'on-up':''}" data-rate="1" data-i="${i}" title="Îmi place">👍</button>
            <button class="rbtn ${meta.rating===2?'on-star':''}" data-rate="2" data-i="${i}" title="Favorită">⭐</button>
            <button class="rbtn ${meta.rating===-1?'on-down':''}" data-rate="-1" data-i="${i}" title="Nu-mi place">👎</button>
          </div>
        </div>
        <textarea class="note" data-note="${i}" placeholder="Notă...">${escapeHtml(meta.note)}</textarea>
      `;
      listEl.appendChild(div);
    });
    listEl.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.play; if(i===current) togglePlay(); else playIdx(i); });
    listEl.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i,v=+b.dataset.rate,n=tracks[i].name,m=getMeta(n); m.rating=(m.rating===v)?0:v; setMeta(n,m); render(); });
    listEl.querySelectorAll('[data-note]').forEach(ta=>ta.oninput=()=>{ const i=+ta.dataset.note,n=tracks[i].name,m=getMeta(n); m.note=ta.value; setMeta(n,m); });
  }

  function playIdx(i){ if(i<0||i>=tracks.length) return; current=i; audio.src=tracks[i].url; audio.play().catch(()=>{}); updateNow(); render(); }
  function togglePlay(){ if(current===-1){ if(tracks.length) playIdx(0); return; } if(audio.paused) audio.play(); else audio.pause(); }

  document.getElementById('playpause').onclick=togglePlay;
  document.getElementById('next').onclick=()=>{ if(current<tracks.length-1) playIdx(current+1); };
  document.getElementById('prev').onclick=()=>{ if(current>0) playIdx(current-1); };
  audio.onended=()=>{ if(current<tracks.length-1) playIdx(current+1); else render(); };
  audio.onplay=()=>{ updateBtn(); render(); };
  audio.onpause=()=>{ updateBtn(); render(); };

  function updateBtn(){ document.getElementById('playpause').textContent=(audio.paused||current===-1)?'▶':'❚❚'; }
  function updateNow(){ document.getElementById('now').innerHTML = current===-1?'Alege o melodie':'Acum: <b>'+escapeHtml(tracks[current].name)+'</b>'; }

  const seek=document.getElementById('seek');
  audio.ontimeupdate=()=>{ document.getElementById('cur').textContent=fmt(audio.currentTime); if(audio.duration) seek.value=(audio.currentTime/audio.duration)*100; };
  audio.onloadedmetadata=()=>{ document.getElementById('dur').textContent=fmt(audio.duration); };
  seek.oninput=()=>{ if(audio.duration) audio.currentTime=(seek.value/100)*audio.duration; };

  loadTracks();
})();
</script>
</body>
</html>
